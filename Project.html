<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="Project.js"></script>
    <style>
        /* Set font and center-align all text */
    body {
        font-family: Arial, sans-serif;
        text-align: center;
    }
     /* Define the game board as a 3x3 grid */
    .board {
        display: grid;
        grid-template-columns: repeat(3, 100px);
        grid-gap: 5px;
        width: 315px;
        margin: 20px auto;
    }
    /* Style for each cell in the grid */
    .cell {
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2em; /* Makes X and O large */
        border: 2px solid black;
        cursor: pointer; /* Changes cursor to indicate clickable area */
    }
    /* Highlight winning cells */
    .cell.winner {
        background-color: lightgreen;
    }
    /* Style for message display */
    .message {
        font-size: 1.2em;
        margin: 10px 0;
    }
     /* Style for the restart button */
    .restart-btn {
        padding: 10px 20px;
        font-size: 1em;
        cursor: pointer;
    }
    </style>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <!-- Display current player's turn or winner message -->
    <div class="message">Player X's turn</div>
    <!-- The Tic-Tac-Toe board -->
    <div class="board"></div>
    <!-- Restart button -->
    <button class="restart-btn">Restart Game</button>
    
</body>
</html>
